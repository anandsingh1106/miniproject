<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RoadLens — Road Damage Detection &amp; Reconstruction Priority</title>
  <meta name="description"
        content="AI road damage detection with reconstruction priority scoring, treatment
                 recommendation and budget allocation for municipal road networks.">
  <meta name="color-scheme" content="light dark">

  <!-- The dev server sends ETag/Last-Modified but no Cache-Control, so a
       browser may reuse this document (and everything it references) without
       revalidating — which shows a stale UI after a change. Force a
       revalidation of the entry document; the ?v= stamps below then pull
       fresh CSS and JS whenever they are bumped. -->
  <meta http-equiv="Cache-Control" content="no-cache">

  <!-- Everything is served locally. No CDN, no external font call, no tracking:
       the page renders fully on an air-gapped machine. Assets come from
       node_modules via `npm run vendor` and are committed, so a fresh clone
       needs no npm at all. -->
  <link rel="preload" href="vendor/inter/inter-latin-wght-normal.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- ?v= is a cache buster. The server sets no Cache-Control, so without it a
       browser may serve a stale stylesheet after a deploy. Bump BUILD below
       (and these stamps) whenever the app's own CSS/JS changes. -->
  <link rel="stylesheet" href="css/app.css?v=25">
  <!-- Material 3 role tokens + component idiom, mapped onto app.css's tokens. -->
  <link rel="stylesheet" href="css/material.css?v=25">
  <!-- Shell layout, layered last so it keeps the final word on structure. -->
  <link rel="stylesheet" href="css/shell.css?v=25">
  <!-- Theme presets override tokens, so they must load after the tokens. -->
  <link rel="stylesheet" href="ui/themes.css?v=25">
  <!-- Skin: shape and surface treatment. Token-free, so it layers over
       whichever preset themes.css has just applied. -->
  <link rel="stylesheet" href="css/skin.css?v=25">

  <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛣️</text></svg>">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="shell">
    <main style="padding:60px 20px;text-align:center;color:#7d7b75">Loading RoadLens…</main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/lucide/lucide.min.js"></script>
  <!-- Floating UI: core first, dom reads it as a global. -->
  <script src="vendor/floating-ui/floating-ui.core.umd.min.js"></script>
  <script src="vendor/floating-ui/floating-ui.dom.umd.min.js"></script>
  <script src="vendor/motion/motion.js"></script>
  <script type="module" src="js/app.js?v=25"></script>
</body>
</html>
